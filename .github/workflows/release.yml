name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: linux-x64
            preset: gcc-release
          - os: windows-2025
            target: windows-x64
            preset: msvc-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC 16 and Ninja
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-16 g++-16 ninja-build
          toolchain_dir="${RUNNER_TEMP}/gcc-16/bin"
          mkdir -p "${toolchain_dir}"
          ln -s /usr/bin/gcc-16 "${toolchain_dir}/gcc"
          ln -s /usr/bin/g++-16 "${toolchain_dir}/g++"
          echo "${toolchain_dir}" >> "${GITHUB_PATH}"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        if: runner.os == 'Windows'
        run: choco install ninja --yes --no-progress

      - name: Verify build tools
        run: |
          cmake --version
          ninja --version

      - name: Verify GCC 16
        if: runner.os == 'Linux'
        run: |
          gcc --version
          g++ --version
          [[ "$(gcc -dumpfullversion)" == 16.* ]]
          [[ "$(g++ -dumpfullversion)" == 16.* ]]

      - name: Configure (Release preset)
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DCI_VERSION=${{ github.ref_name }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Package with CPack
        run: cpack
        working-directory: build/${{ matrix.preset }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: expp-${{ matrix.target }}
          path: |
            build/${{ matrix.preset }}/*.zip
            build/${{ matrix.preset }}/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-26.04
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
